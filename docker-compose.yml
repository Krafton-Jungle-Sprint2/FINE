services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "${MYSQL_PORT}:3306"      # 호스트:컨테이너(내부는 항상 3306)
    volumes:
      - mysql_dev_data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d
    networks: [team_network_dev]
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --general-log=1
      --general-log-file=/var/lib/mysql/general.log
    healthcheck:
      test: ["CMD-SHELL","mysqladmin ping -h 127.0.0.1 -P 3306 -u${MYSQL_ROOT_USER} -p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    restart: unless-stopped
    env_file:
      - ./backend/.env.app           # 앱 시크릿
    environment:
      TZ: ${TZ}
      # 컨테이너 내부 DB 연결은 항상 서비스명:3306
      DATABASE_URL: "mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@${MYSQL_HOST}:${MYSQL_INTERNAL_PORT}/${MYSQL_DATABASE}"
      SHADOW_DATABASE_URL: "mysql://${MYSQL_ROOT_USER}:${MYSQL_ROOT_PASSWORD}@${MYSQL_HOST}:${MYSQL_INTERNAL_PORT}/${MYSQL_SHADOW_DATABASE}"
      API_PORT: "${API_PORT}"
      SOCKET_PORT: "${SOCKET_PORT}"
      NODE_ENV: "development"
      FRONTEND_URL: "${FRONTEND_URL}"
    ports:
      - "${API_PORT}:4000"
      - "${SOCKET_PORT}:5000"
      - "${INSPECT_PORT}:9229"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - node_modules_dev:/app/node_modules
    networks: [team_network_dev]
    command: npm run dev
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  prisma-studio:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    working_dir: /app
    env_file:
      - ./backend/.env.app
    environment:
      TZ: ${TZ}
      DATABASE_URL: "mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@${MYSQL_HOST}:${MYSQL_INTERNAL_PORT}/${MYSQL_DATABASE}"
      NODE_ENV: "development"
    volumes:
      - ./backend:/app
      - node_modules_dev:/app/node_modules
    ports:
      - "${PRISMA_STUDIO_PORT}:5555"
    networks: [team_network_dev]
    depends_on:
      mysql:
        condition: service_healthy
      backend:
        condition: service_started
    command: ["sh","-lc","exec npx prisma studio --port 5555 --hostname 0.0.0.0 --browser none"]
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "2" }

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_dev_data:/data
    networks: [team_network_dev]
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD","redis-cli","ping"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  mysql_dev_data:
  node_modules_dev:
  redis_dev_data:

networks:
  team_network_dev:
    driver: bridge
